services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: superbot
      POSTGRES_USER: superbot
      POSTGRES_PASSWORD: superbot
    ports:
      - "5432:5432"
    volumes:
      - superbot_postgres:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superbot -d superbot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  superbot_postgres:
